# Reads a .env file in this directory (see .env.example).
# NEXT_PUBLIC_* are baked in at build time. Rebuild after changing them.
# GOOGLE_SHEET_* are read when the container starts.

name: reevue

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_SOCIAL_FACEBOOK: ${NEXT_PUBLIC_SOCIAL_FACEBOOK:-}
        NEXT_PUBLIC_SOCIAL_INSTAGRAM: ${NEXT_PUBLIC_SOCIAL_INSTAGRAM:-}
        NEXT_PUBLIC_SOCIAL_LINKEDIN: ${NEXT_PUBLIC_SOCIAL_LINKEDIN:-}
        NEXT_PUBLIC_SOCIAL_YOUTUBE: ${NEXT_PUBLIC_SOCIAL_YOUTUBE:-}
        NEXT_PUBLIC_SOCIAL_TIKTOK: ${NEXT_PUBLIC_SOCIAL_TIKTOK:-}
    image: reevue-lp
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      GOOGLE_SHEET_WEBHOOK_URL: ${GOOGLE_SHEET_WEBHOOK_URL:-}
      GOOGLE_SHEET_WEBHOOK_SECRET: ${GOOGLE_SHEET_WEBHOOK_SECRET:-}
    restart: unless-stopped
