# Reads a .env file in this directory (see .env.example).
# NEXT_PUBLIC_* are baked in at build time. Rebuild after changing them.
# The container runs in production and posts leads to Google Sheets.
# GOOGLE_SHEET_* are read when the container starts.

name: reevue

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_EMAIL: ${NEXT_PUBLIC_EMAIL:-}
        NEXT_PUBLIC_FACEBOOK_URL: ${NEXT_PUBLIC_FACEBOOK_URL:-}
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL:-}
        NEXT_PUBLIC_YOUTUBE_URL: ${NEXT_PUBLIC_YOUTUBE_URL:-}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
    image: reevue-lp
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      GOOGLE_SHEET_WEBHOOK_URL: ${GOOGLE_SHEET_WEBHOOK_URL:-}
      GOOGLE_SHEET_WEBHOOK_SECRET: ${GOOGLE_SHEET_WEBHOOK_SECRET:-}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-}
    restart: unless-stopped
